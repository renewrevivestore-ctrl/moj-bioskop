<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src blob: 'self';">
  <title>Moj Bioskop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" data-go="movies"><span class="logo">▶</span><span class="brand-name">Moj Bioskop</span></div>
    <nav class="tabs">
      <button data-go="movies">Filmovi i serije <span class="badge hidden" id="newBadge"></span></button>
      <button data-go="tv">TV uživo</button>
      <button data-go="catalog">Katalog sajtova</button>
      <button data-go="mylist">Moja lista</button>
    </nav>
    <div class="search">
      <input id="search" type="search" placeholder="Pretraži…" autocomplete="off">
    </div>
    <button class="icon-btn" data-go="settings" title="Podešavanja">⚙</button>
  </header>

  <main id="view"></main>

  <!-- Detalji naslova -->
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>

  <!-- Plejer -->
  <div id="player" class="player hidden">
    <div class="player-top">
      <button class="icon-btn" id="pClose" title="Zatvori (Esc)">✕</button>
      <div class="p-title" id="pTitle"></div>
      <div class="p-actions">
        <button class="btn small" id="pSubs">Titlovi</button>
        <button class="btn small ghost" id="pAlt" title="Probaj drugi izvor">Drugi izvor</button>
      </div>
    </div>
    <div class="p-stage" id="pStage">
      <video id="pVideo" controls autoplay playsinline></video>
      <div class="p-msg hidden" id="pMsg"></div>
    </div>
    <div class="subs-panel hidden" id="subsPanel"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="updateBar" class="update-bar hidden"></div>

  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/subs.js"></script>
  <script src="js/player.js"></script>
  <script src="js/movies.js"></script>
  <script src="js/tv.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/mylist.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
